aboutH:'Hello, I’m Wuraola Odunewu.',
about:`I’m a Virtual Administrative & Operations Support professional with experience supporting business administration, client coordination, documentation, customer communication and HR-related activities.
My background includes working in a travel and study-abroad support company, providing administrative support to a professional association, and contributing to HR administration through volunteer roles.
Through these experiences, I’ve developed a practical understanding of the work that keeps a business running behind the scenes — from maintaining organised records and managing documentation to coordinating activities, tracking pending tasks and ensuring important follow-ups are not overlooked.
I enjoy bringing structure to everyday work, keeping information organised and helping people stay on top of their responsibilities.
I approach every assignment with attention to detail, clear communication, accountability and a willingness to understand how a business operates before providing support.
My goal is simple: to help growing businesses spend less time worrying about administrative details and more time focusing on the work that moves their business forward.`,

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const get=p=>p.split('.').reduce((o,k)=>o&&o[k],d);
const set=(p,v)=>{const a=p.split('.'),l=a.pop();a.reduce((o,k)=>o[k],d)[l]=v};
const count=()=>(d.photo?1:0)+d.samples.filter(s=>s.image).length;
const Ln=s=>String(s||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);
const col=d=>Object.assign({},T[d.theme]||T.s,d.col||{});
const ink=h=>{const n=parseInt(String(h).slice(1),16);return .299*(n>>16)+.587*(n>>8&255)+.114*(n&255)>150?'#1B1410':'#FFFFFF'};
const hl=s=>{const a=String(s||'').trim().split(' '),l=a.pop();return esc(a.join(' '))+' <em>'+esc(l)+'</em>'};
function rv(){const e=[].slice.call(document.querySelectorAll('.rv'));if(!('IntersectionObserver' in window)){e.forEach(x=>x.classList.add('in'));return}const o=new IntersectionObserver(r=>r.forEach(i=>{if(i.isIntersecting){i.target.classList.add('in');o.unobserve(i.target)}}),{threshold:.08});e.forEach(x=>o.observe(x))}

function dcv(a){const s=a.dataset.u,b=atob(s.split(',')[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([u],{type:'application/pdf'}));l.download=a.dataset.f;document.body.appendChild(l);l.click();l.remove();return false}
const cvName=d=>(String(d.name||'My').trim().replace(/[^\w]+/g,'_')||'My')+'_CV.pdf';

function site(d){
const c=col(d),v='--dk:'+c.dk+';--lt:'+c.lt+';--hi:'+c.hi+';--ac:'+c.ac+';--hx:'+ink(c.hi),sam=d.samples.filter(s=>s.image),w=(d.whatsapp||'').replace(/\D/g,''),ini=esc((d.name||'?').trim().charAt(0).toUpperCase());

const pl=(s,t)=>'<div class="pl'+(t?' t':'')+'">'+Ln(s).map(x=>'<span>'+esc(x)+'</span>').join('')+'</div>';
let h=`<div class="site" style="${v}"><header class="hdr"><div class="lg"><b>${ini}</b><div><span>${esc(d.name)}</span><small>${esc(d.title)}</small></div></div><nav class="nv"><a href="#about">About</a><a href="#services">Services</a>${sam.length?'<a href="#work">Work</a>':''}<a href="#contact">Contact</a></nav>${d.cv?`<a href="#" class="cvb" data-u="${d.cv}" data-f="${esc(cvName(d))}" onclick="return dcv(this)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 21h16"/></svg>Download CV</a>`:''}</header>`;

h+=`<section id="about" class="w two"><h2 class="rv">${esc(d.aboutH)}</h2><div class="rv">${Ln(d.about).map(x=>'<p>'+esc(x)+'</p>').join('')}</div></section>`;
h+=`<section id="services" class="dkb"><div class="w"><h2 class="rv" style="max-width:760px">${esc(d.svcH)}</h2><p class="rv" style="max-width:700px;opacity:.85">${esc(d.svcIntro)}</p><div class="g3">${d.services.map((s,i)=>`<div class="sv rv"><small>0${i+1}</small><h3>${esc(s.name)}</h3>${li(s.items)}</div>`).join('')}</div>${d.svcNote?`<p class="rv" style="margin-top:34px;color:var(--hi)">${esc(d.svcNote)}</p>`:''}</div></section>`;

h+=`<footer class="ft dkb">© ${esc(d.name)} · ${esc(d.title)}<div class="noprint" data-live="${esc(d.live)}" style="margin-top:12px"><button class="bn o" onclick="sh('c',this)">Copy link</button><button class="bn o" onclick="sh('w',this)">Share on WhatsApp</button><button class="bn o" onclick="sh('l',this)">Share on LinkedIn</button><button class="bn o" onclick="sh('p',this)">Save as PDF</button></div></footer></div>`;
return h}
const F=(l,k,r)=>'<label>'+l+'</label>'+(r?'<textarea rows="'+r+'" data-k="'+k+'">'+esc(get(k))+'</textarea>':'<input data-k="'+k+'" value="'+esc(get(k))+'">');
const U=(l,k)=>'<label>'+l+'</label>'+(get(k)?'<img class="pv" src="'+get(k)+'" alt=""><button class="b" data-rm="'+k+'">Remove image</button>':'')+'<input type="file" accept="image/*" data-up="'+k+'">';
function list(key,title,hint){return '<div class="ec"><h3>'+title+'</h3><p>'+hint+'</p>'+d[key].map((x,i)=>'<div class="sub"><p><b>'+(i+1)+'</b></p>'+LS[key].map(f=>f[2]=='img'?U(f[0],key+'.'+i+'.'+f[1]):F(f[0],key+'.'+i+'.'+f[1],f[2]?4:0)).join('')+'<br><button class="b" data-del="'+key+'.'+i+'">Remove</button></div>').join('')+(d[key].length<LIM[key]?'<div class="sub"><button class="b" data-add="'+key+'">Add</button></div>':'')+'</div>'}
const card=(t,h,x)=>'<div class="ec"><h3>'+t+'</h3>'+(h?'<p>'+h+'</p>':'')+x+'</div>';
function ed(){const c=col(d);
return card('Look','Pick a theme, then fine-tune any colour.','<div class="sw">'+Object.keys(T).map(k=>'<button class="b '+(d.theme==k?'on':'')+'" data-th="'+k+'"><i style="background:'+T[k].dk+'"></i><i style="background:'+T[k].hi+'"></i><i style="background:'+T[k].ac+'"></i>'+T[k].n+'</button>').join('')+'</div><div class="sw">'+CK.map(k=>'<label>'+k[1]+'<input type="color" data-c="'+k[0]+'" value="'+c[k[0]]+'"></label>').join('')+'</div><div class="sw"><button class="b" data-rc="1">Reset colours</button></div>')
+card('Homepage','Name, headline, portrait and buttons.',F('Name','name')+F('Professional title','title')+F('Headline (last word is highlighted)','headline')+F('Introduction','intro',4)+F('Service labels (one per line)','labels',4)+F('Location line','location')+F('Button 1','btn1')+F('Button 2','btn2')+U('Portrait photo (upload or replace)','photo')+F('Highlights strip (one per line)','strip',3))
+card('Download CV','Upload your final CV as a PDF (up to 1.5 MB). The Download CV button shows in the header only while a CV is uploaded.',(d.cv?'<p><b>CV uploaded</b> ('+d.cvKB+' KB). Visitors will download it as <b>'+esc(cvName(d))+'</b>.</p><button class="b" data-rcv="1">Remove CV</button>':'<p>No CV uploaded yet, so the button is hidden.</p>')+'<label>'+(d.cv?'Replace CV (PDF)':'Upload CV (PDF)')+'</label><input type="file" accept="application/pdf,.pdf" data-cv="1">')
+card('About me','One paragraph per line.',F('Heading','aboutH')+F('Text','about',10))
+card('Services intro','',F('Heading','svcH')+F('Introduction','svcIntro',4)+F('Note under services','svcNote',2))+list('services','Services','Edit, add or remove services.')
+card('Experience intro','',F('Heading','expH')+F('Introduction','expIntro',4))+list('exp','Relevant experience','Keep it short.')
+card('Work samples intro','Only samples with an uploaded image appear on the site.',F('Heading','wsH')+F('Introduction','wsIntro',3))+list('samples','Work samples','Upload screenshots to show them.')
+card('Tools & skills','One per line.',F('Heading','skH')+F('Skills','skills',8)+F('Tools','tools',4))
+card('How I work intro','',F('Heading','howH')+F('Introduction','howIntro',3))+list('steps','How I work','Your working process.')
+card('Contact','Add your email for the email button and built-in form, or add a form link (such as a Google Form) to send visitors there instead.',F('Heading','ctH')+F('Introduction','ctIntro',3)+F('Email','email')+F('Contact form link (for example a Google Form)','formLink')+F('WhatsApp number (with country code)','whatsapp')+F('LinkedIn profile link','linkedin')+F('Form button text','ctBtn')+F('My live website address (used by Copy link)','live'))}
function draw(){document.getElementById('app').innerHTML=mode=='edit'?ed():site(d);document.getElementById('be').className='b '+(mode=='edit'?'on':'');document.getElementById('bv').className='b '+(mode=='view'?'on':'');document.getElementById('cnt').textContent='Images used: '+count()+' of '+MAX;if(mode=='view')rv()}
function shrink(f,max,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.82))};i.src=r.result};r.readAsDataURL(f)}
function msg(t){const c=document.getElementById('cnt');c.textContent=t;setTimeout(()=>{c.textContent='Images used: '+count()+' of '+MAX},3500)}
function dl(n,t,s){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:t}));a.download=n;document.body.appendChild(a);a.click();a.remove()}
function exp(){const x='</'+'script>';dl('my-portfolio.html','text/html','<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(d.name)+' · '+esc(d.title)+'</title>'+document.querySelector('link[href*=fonts]').outerHTML+'<style>'+document.getElementById('sc').textContent+'</style></head><body>'+site(d)+'<script>'+[rv,lb,mf,sh,dcv].map(f=>f.toString()).join(';')+';rv()'+x+'</body></html>')}
document.addEventListener('input',e=>{const t=e.target.dataset||{};if(t.k){set(t.k,e.target.value);save()}else if(t.c){(d.col=d.col||{})[t.c]=e.target.value;save()}});
document.addEventListener('change',e=>{const t=e.target.dataset||{},f=e.target.files&&e.target.files[0];if(!f)return;
if(t.imp){const r=new FileReader();r.onload=()=>{try{d=Object.assign(clone(D0),JSON.parse(r.result));save();draw();msg('Content restored')}catch(x){msg('That backup file could not be read')}};r.readAsText(f);e.target.value='';return}
if(t.cv){if(f.type!='application/pdf'&&!/\.pdf$/i.test(f.name)){e.target.value='';msg('Please choose a PDF file');return}if(f.size>1572864){e.target.value='';msg('That PDF is over 1.5 MB. Please compress it first.');return}const r=new FileReader();r.onload=()=>{d.cv=r.result;d.cvKB=Math.round(f.size/1024);save();draw();msg('CV uploaded')};r.readAsDataURL(f);return}
if(!t.up)return;if(!get(t.up)&&count()>=MAX){msg('All '+MAX+' images used. Remove one first.');e.target.value='';return}shrink(f,/photo$/.test(t.up)?900:1400,u=>{set(t.up,u);save();draw()})});
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const D=t.dataset;
if(D.mode){mode=D.mode;draw();scrollTo(0,0)}
else if(D.th){d.theme=D.th;d.col={};save();draw()}
else if(D.rc){d.col={};save();draw()}
else if(D.add){const o={};LS[D.add].forEach(f=>o[f[1]]='');d[D.add].push(o);save();draw()}
else if(D.del){const a=D.del.split('.');d[a[0]].splice(+a[1],1);save();draw()}
else if(D.rm){set(D.rm,'');save();draw()}
else if(D.rcv){d.cv='';d.cvKB=0;save();draw()}
else if(D.bk)dl('portfolio-backup.json','application/json',JSON.stringify(d))
else if(D.exp)exp()});
draw();
</script>
